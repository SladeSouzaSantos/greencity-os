name: Flutter Analyze and Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up local development environment
        run: cp .env.example .env
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify generated Isar schema
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/domain/entities/inverter.g.dart
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test

  windows-solar3d:
    name: Windows desktop build and tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Windows app environment
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          flutter config --enable-windows-desktop
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify desktop unit tests
        run: flutter test
      - name: Compile Windows desktop
        run: flutter build windows --debug
